<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Task Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    main { max-width: 480px; width: 100%; text-align: center; }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    p { color: #64748b; margin-bottom: 24px; }
    a { display: block; padding: 16px; margin-bottom: 12px; border-radius: 12px; color: #fff; text-decoration: none; font-size: 1.1rem; transition: opacity .2s; }
    a:hover { opacity: .85; }
    .v { background: #4f46e5; } .r { background: #0891b2; } .s { background: #334155; }
  </style>
</head>
<body>
  <main>
    <h1>My Task Manager</h1>
    <p>Web App 個人課堂實作</p>
    <a class="v" href="vanilla/">JavaScript 版（完整功能）</a>
    <a class="r" href="react/">React 版（新增／完成／刪除）</a>
    <a class="s" id="src" href="https://github.com/">原始碼（GitHub）</a>
  </main>
  <script>
    // 在 GitHub Pages 上自動推算 repo 網址：帳號.github.io/repo/ → github.com/帳號/repo
    const host = location.hostname;
    if (host.endsWith(".github.io")) {
      const user = host.replace(".github.io", "");
      const repo = location.pathname.split("/")[1];
      document.getElementById("src").href = `https://github.com/${user}/${repo}`;
    }
  </script>
</body>
</html>
